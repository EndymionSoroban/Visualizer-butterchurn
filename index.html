<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Butterchurn Desktop Visualizer</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' http://localhost:5173 http://127.0.0.1:5173; script-src 'self' 'unsafe-inline' 'unsafe-eval' http://localhost:5173 http://127.0.0.1:5173; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' ws://localhost:5173 ws://127.0.0.1:5173 http://localhost:5173 http://127.0.0.1:5173; img-src 'self' data: blob:; media-src 'self' http://localhost:5173 http://127.0.0.1:5173 blob: data:;" />
    
    <!-- Modern Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
      body { 
        margin: 0; 
        padding: 0; 
        background-color: #000; 
        overflow: hidden; 
        font-family: 'Inter', 'Outfit', system-ui, -apple-system, sans-serif;
        user-select: none;
      }
      #root { width: 100vw; height: 100vh; }
      
      /* Premium glowing scrubbable progress slider */
      .progress-slider {
        -webkit-appearance: none;
        appearance: none;
        flex: 1;
        height: 6px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.15);
        outline: none;
        cursor: pointer;
        transition: background 0.3s;
      }
      .progress-slider:hover {
        background: rgba(255, 255, 255, 0.25);
      }
      .progress-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #00f2fe;
        box-shadow: 0 0 10px #00f2fe;
        cursor: pointer;
        transition: transform 0.2s, background 0.2s;
      }
      .progress-slider::-webkit-slider-thumb:hover {
        transform: scale(1.3);
        background: #fff;
        box-shadow: 0 0 15px #fff;
      }
      .progress-slider::-moz-range-thumb {
        width: 12px;
        height: 12px;
        border: none;
        border-radius: 50%;
        background: #00f2fe;
        box-shadow: 0 0 10px #00f2fe;
        cursor: pointer;
        transition: transform 0.2s, background 0.2s;
      }
      .progress-slider::-moz-range-thumb:hover {
        transform: scale(1.3);
        background: #fff;
        box-shadow: 0 0 15px #fff;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
